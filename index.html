<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>中古機現貨｜復原者手機維修</title>
<meta name="description" content="復原者手機維修 楠梓店・德賢店 中古機現貨，上架前完整驗機、附檢測報告與實機照片，LINE 真人接洽。">
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#16181d; --sub:#6b7280; --line:#e5e7eb;
    --accent:#111827; --red:#d71920; --line-green:#06c755; --gold:#b8892d; --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  button{font-family:inherit}
  .wrap{max-width:1120px;margin:0 auto;padding:0 16px}
  header.hero{background:#fff;border-bottom:1px solid var(--line);padding:26px 0 18px}
  .hero h1{margin:0 0 6px;font-size:26px;letter-spacing:.5px}
  .hero p{margin:0;color:var(--sub);font-size:14px;line-height:1.6}
  .badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .badge{font-size:12px;padding:5px 10px;border-radius:999px;background:#f3f4f6;color:#374151}
  .badge.hl{background:#fdecec;color:var(--red)}

  .toolbar{position:sticky;top:0;z-index:20;background:rgba(246,247,249,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 0}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .search{flex:1 1 220px;display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:0 12px}
  .search input{border:0;outline:0;padding:11px 6px;font-size:15px;width:100%;background:transparent}
  select{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font-size:14px;color:var(--ink)}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-top:10px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .meta{color:var(--sub);font-size:13px;margin:14px 0 10px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;padding-bottom:40px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:box-shadow .15s}
  .card:hover{box-shadow:0 6px 20px rgba(0,0,0,.06)}
  .cover{aspect-ratio:1/1;background:#f3f4f6 center/cover no-repeat;position:relative}
  .cover .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9ca3af;font-size:44px}
  .tag{position:absolute;top:10px;left:10px;font-size:12px;padding:4px 8px;border-radius:6px;background:rgba(255,255,255,.92);border:1px solid var(--line)}
  .tag.store{left:auto;right:10px;color:var(--red);font-weight:700}
  .tag.cnt{top:auto;bottom:10px;left:auto;right:10px}
  .body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
  .name{font-weight:700;font-size:16px;line-height:1.35}
  .specs{display:flex;flex-wrap:wrap;gap:6px}
  .spec{font-size:12px;color:#374151;background:#f3f4f6;border-radius:6px;padding:3px 8px}
  .price{margin-top:auto;padding-top:6px;font-size:22px;font-weight:800;color:var(--red)}
  .actions{display:flex;gap:8px;padding:0 14px 14px}
  .btn{flex:1;border:0;border-radius:10px;padding:11px 10px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
  .btn.ghost{background:#f3f4f6;color:var(--ink)}
  .btn.line{background:var(--line-green);color:#fff}
  .btn.pay{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .empty{grid-column:1/-1;text-align:center;color:var(--sub);padding:60px 0;line-height:1.8}
  .skeleton{background:linear-gradient(90deg,#eee 25%,#f6f6f6 50%,#eee 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:var(--radius);height:360px}
  @keyframes sh{to{background-position:-200% 0}}

  /* 詳細頁 */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none}
  .mask.show{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-radius:18px 18px 0 0;max-height:92vh;overflow:auto;transform:translateY(100%);transition:transform .25s ease}
  .sheet.show{transform:none}
  @media(min-width:760px){.sheet{max-width:620px;margin:0 auto}}
  .sheet .close{position:sticky;top:0;z-index:2;display:flex;justify-content:flex-end;padding:8px 8px 0;background:linear-gradient(#fff,rgba(255,255,255,0))}
  .sheet .close button{border:0;background:#f3f4f6;border-radius:999px;width:34px;height:34px;font-size:16px;cursor:pointer}
  .gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:6px;padding:0 16px;scrollbar-width:none;margin-top:-26px}
  .gallery::-webkit-scrollbar{display:none}
  .gallery img{flex:none;width:88%;max-width:520px;aspect-ratio:1/1;object-fit:cover;border-radius:12px;scroll-snap-align:center;background:#f3f4f6;cursor:zoom-in}
  .gallery .noimg{flex:none;width:100%;aspect-ratio:16/9;border-radius:12px;background:#f3f4f6;display:flex;align-items:center;justify-content:center;color:#9ca3af}
  .dots{text-align:center;color:var(--sub);font-size:12px;margin-top:6px}
  .detail{padding:14px 16px calc(18px + env(safe-area-inset-bottom))}
  .detail h2{margin:4px 0 4px;font-size:20px}
  .detail .p{font-size:26px;font-weight:800;color:var(--red);margin:6px 0 10px}
  .box{border:1px solid var(--line);border-radius:12px;margin-top:14px;overflow:hidden}
  .box h3{margin:0;font-size:15px;padding:12px 14px;background:#f9fafb;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .box h3 small{font-weight:400;color:var(--sub);font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  td{padding:9px 14px;border-bottom:1px solid #f1f2f4;vertical-align:top}
  td:first-child{color:var(--sub);width:42%}
  tr:last-child td{border-bottom:0}
  td.bad{color:var(--red);font-weight:700}
  .note{font-size:12.5px;color:var(--sub);line-height:1.7;padding:12px 14px}
  .stickyAct{position:sticky;bottom:0;background:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px}
  .viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:60;display:none;align-items:center;justify-content:center}
  .viewer.show{display:flex}
  .viewer img{max-width:100%;max-height:100%}

  footer{text-align:center;color:var(--sub);font-size:12px;padding:20px 16px 50px;line-height:1.8}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <h1>中古機現貨</h1>
    <p>楠梓店・德賢店 現貨，上架前逐項驗機，附實機照片與檢測報告。<br>看中哪一台，按「LINE 詢問」由門市真人為您服務。</p>
    <div class="badges">
      <span class="badge hl">店保 30 天 + CARE+ 30 天</span>
      <span class="badge">逐項檢測報告</span>
      <span class="badge">實機照片</span>
      <span class="badge">現金・全支付・LINE Pay</span>
    </div>
  </div>
</header>

<div class="toolbar">
  <div class="wrap">
    <div class="row">
      <div class="search">🔍<input id="q" type="search" placeholder="搜尋機型、容量、顏色…"></div>
      <select id="store">
        <option value="">全部門市</option>
        <option value="楠梓店">楠梓店</option>
        <option value="德賢店">德賢店</option>
      </select>
      <select id="sort">
        <option value="new">最新上架</option>
        <option value="low">價格低→高</option>
        <option value="high">價格高→低</option>
        <option value="battery">電池健康度</option>
      </select>
    </div>
    <div class="chips" id="brands"></div>
  </div>
</div>

<main class="wrap">
  <div class="meta" id="meta">讀取現貨中…</div>
  <div class="grid" id="grid"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
</main>

<footer>
  復原者手機維修・楠梓店 高雄市楠梓區楠梓路10號（0900-038-552）<br>
  德賢店 高雄市楠梓區德賢路258號（0971-626-883）<br>
  營業時間 週一至週六 11:00–21:00（週日公休）<br>
  照片與檢測報告為驗機當時狀況，外觀以實機為準；價格與庫存以門市確認為準。
</footer>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet"></div>
<div class="viewer" id="viewer"><img id="viewImg" alt="放大照片"></div>

<script>
/* =========================================================
   ① 門市 LINE@
   ========================================================= */
const STORES = {
  "楠梓店": { lineId: "@826ztlds", tel: "0900038552" },
  "德賢店": { lineId: "@347agrda", tel: "0971626883" }
};

/* =========================================================
   ② 無卡分期（還沒簽約，先關著）
   簽約後：enabled 改 true，url 填分期商品頁網址。
   網址裡可以用 {price} {model}，會自動換成那台的售價和機型。
   ========================================================= */
const INSTALLMENT = {
  enabled: false,
  label: "無卡分期",
  url: ""          // 例："https://分期廠商網址/apply?amount={price}"
};

/* =========================================================
   ③ 資料來源：保固系統「中古機庫存」自動整理的現貨清單（唯讀）
   在 care/stock.html 改庫存、上傳照片、填驗機表後，這裡會跟著更新
   ========================================================= */
const SHOWCASE_URL = "https://firestore.googleapis.com/v1/projects/care-warranty/databases/(default)/documents/settings/used_showcase?key=AIzaSyD04ZMXIt8Oo3hjm5qsMaKiLXYzp_9YKwA";
const CACHE_MIN = 3;   // 同一位客人 3 分鐘內重開頁面不重複讀，省資料庫額度

/* 驗機表項目（跟 care/stock.html 的 CHECK_ITEMS 同一份順序；IMEI 不顯示） */
const CHECK = [['ver','銷售國家版本'],['carrier','是否有電信業者鎖定'],['account','iCloud／Google 帳號已退出'],['orig','原廠保固到期時間'],['look','螢幕外觀'],
  ['screen','螢幕功能狀況'],['touch','觸控狀況'],['grade','機身新舊程度'],['bio','臉部／指紋辨識'],['cell','4G／5G 網路'],['wifi','Wi-Fi'],
  ['bt','藍牙'],['fcam','前鏡頭拍照'],['rcam','後鏡頭拍照'],['btn','機身所有按鈕'],['spk','喇叭和聽筒'],['mic','麥克風錄音'],['port','充電口'],['qi','無線充電'],
  ['nfc','NFC'],['prox','距離感應'],['light','自動亮度感應']];

/* ========================================================= */
let items = [];
let state = { q:"", brand:"全部", store:"", sort:"new" };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => "$" + Number(n).toLocaleString("zh-TW");
const img = (id, w) => "https://lh3.googleusercontent.com/d/" + encodeURIComponent(id) + "=w" + w;
const bat = b => b ? String(b).replace(/%$/, "") : "";

function brandOf(m){
  const s = String(m||"");
  if (/iphone/i.test(s)) return "iPhone";
  if (/ipad/i.test(s)) return "iPad";
  if (/galaxy|samsung|三星|^s\d|^a\d|^z\s?(flip|fold)|^note/i.test(s)) return "Samsung";
  if (/pixel|google/i.test(s)) return "Google";
  if (/redmi|xiaomi|小米|poco/i.test(s)) return "小米";
  if (/oppo|reno|find/i.test(s)) return "OPPO";
  if (/vivo/i.test(s)) return "vivo";
  if (/sony|xperia/i.test(s)) return "Sony";
  if (/asus|zenfone|rog/i.test(s)) return "ASUS";
  if (/watch/i.test(s)) return "手錶";
  return "其他";
}

async function load(){
  let json = null;
  try{
    const c = JSON.parse(sessionStorage.getItem("gmf_showcase") || "null");
    if (c && Date.now() - c.t < CACHE_MIN*60000) json = c.json;
  }catch(e){}
  if (json == null){
    try{
      const r = await fetch(SHOWCASE_URL);
      if (!r.ok) throw new Error("HTTP " + r.status);
      const d = await r.json();
      json = d.fields?.json?.stringValue || "[]";
      try{ sessionStorage.setItem("gmf_showcase", JSON.stringify({ t: Date.now(), json })); }catch(e){}
    }catch(e){
      console.warn("讀取現貨失敗", e);
      $("#meta").textContent = "";
      $("#grid").innerHTML = `<div class="empty">現貨清單暫時讀不到，請稍後再試<br>或直接 <a href="${lineUrl("楠梓店","想詢問目前有哪些中古機")}">LINE 詢問門市</a></div>`;
      return;
    }
  }
  try{ items = JSON.parse(json) || []; }catch(e){ items = []; }
  items.forEach((p,i) => { p._i = i; p._brand = brandOf(p.model); });
  renderBrands(); render();
  const m = location.hash.match(/^#item=(.+)$/);
  if (m) { const p = items.find(x => String(x.id) === decodeURIComponent(m[1])); if (p) openItem(p); }
}

function renderBrands(){
  const order = ["iPhone","iPad","Samsung","Google","小米","OPPO","vivo","Sony","ASUS","手錶","其他"];
  const have = new Set(items.map(p=>p._brand));
  const brands = ["全部", ...order.filter(b=>have.has(b))];
  $("#brands").innerHTML = brands.map(b=>`<button class="chip ${b===state.brand?"on":""}" data-b="${esc(b)}">${esc(b)}</button>`).join("");
  $("#brands").querySelectorAll(".chip").forEach(el=>el.onclick=()=>{ state.brand=el.dataset.b; renderBrands(); render(); });
}

function specs(p){
  const c = p.check || {};
  const out = [];
  if (p.color) out.push(p.color);
  const b = bat(p.battery || c.battery); if (b) out.push("電池 " + b + "%");
  if (p.cond) out.push(p.cond);
  if (p.waterproof) out.push("氣密正常");
  if (p.box) out.push("盒裝");
  if (p.cable) out.push("原廠線");
  return out;
}

function render(){
  const q = state.q.toLowerCase();
  let list = items.filter(p=>{
    if (state.brand!=="全部" && p._brand!==state.brand) return false;
    if (state.store && p.branch!==state.store) return false;
    if (q){
      const hay = [p.model,p.color,p.cond,p.acc,p.branch].join(" ").toLowerCase();
      if (!q.split(/\s+/).every(w=>hay.includes(w))) return false;
    }
    return true;
  });
  list.sort((a,b)=>{
    if (state.sort==="low") return a.price-b.price;
    if (state.sort==="high") return b.price-a.price;
    if (state.sort==="battery") return (Number(bat(b.battery||b.check?.battery))||0)-(Number(bat(a.battery||a.check?.battery))||0);
    return a._i-b._i;   // 清單本來就是新到舊
  });
  $("#meta").textContent = `共 ${list.length} 台現貨`;
  if (!list.length){
    $("#grid").innerHTML = `<div class="empty">${items.length ? "找不到符合的機型" : "目前現貨都被訂走了"}<br>可以 <a href="${lineUrl(state.store||"楠梓店","想詢問有沒有適合的中古機")}">LINE 詢問門市</a>，幫你留意或調貨</div>`;
    return;
  }
  $("#grid").innerHTML = list.map(p=>{
    const ph = (p.photos||[]).filter(Boolean);
    return `
    <div class="card" data-i="${p._i}">
      <div class="cover" ${ph[0]?`style="background-image:url('${img(ph[0],600)}')"`:""}>
        ${ph[0]?"":`<div class="ph">📱</div>`}
        <span class="tag store">${esc(p.branch||"門市")}</span>
        ${ph.length>1?`<span class="tag cnt">📷 ${ph.length}</span>`:""}
      </div>
      <div class="body">
        <div class="name">${esc(p.model)}</div>
        <div class="specs">${specs(p).map(s=>`<span class="spec">${esc(s)}</span>`).join("")}</div>
        <div class="price">${fmt(p.price)}</div>
      </div>
      <div class="actions">
        <button class="btn ghost" data-act="more">看照片・檢測報告</button>
        <button class="btn line" data-act="line">LINE 詢問</button>
      </div>
    </div>`;
  }).join("");
  $("#grid").querySelectorAll(".card").forEach(el=>{
    const p = items[Number(el.dataset.i)];
    el.onclick = e => {
      const act = e.target.closest("[data-act]")?.dataset.act;
      if (act === "line") { e.stopPropagation(); askLine(p); return; }
      openItem(p);
    };
  });
}

function checkTable(p){
  const c = p.check;
  if (!c) return `<div class="box"><h3>檢測報告</h3><div class="note">這台的檢測報告整理中，到店時會現場驗機給您看。</div></div>`;
  const rows = [];
  const b = bat(c.battery || p.battery); if (b) rows.push(["電池健康度", b + "%"]);
  CHECK.forEach(([k,l]) => { if (c[k]) rows.push([l, c[k]]); });
  return `<div class="box"><h3>檢測報告${c.date?`<small>驗機日期 ${esc(c.date)}</small>`:""}</h3>
    <table>${rows.map(([l,v])=>`<tr><td>${esc(l)}</td><td class="${v==="異常"?"bad":""}">${esc(v)}</td></tr>`).join("")}</table></div>`;
}

function openItem(p){
  const ph = (p.photos||[]).filter(Boolean);
  const days = Number(p.check?.days) || 30;
  const extra = [p.waterproof?"氣密正常":"", p.box?"盒裝":"", p.cable?"原廠線":"", p.acc].filter(Boolean).join("・");
  const pay = INSTALLMENT.enabled && INSTALLMENT.url
    ? `<a class="btn pay" href="${esc(INSTALLMENT.url.replace("{price}", encodeURIComponent(p.price)).replace("{model}", encodeURIComponent(p.model)))}" target="_blank" rel="noopener">💳 ${esc(INSTALLMENT.label)}</a>` : "";
  $("#sheet").innerHTML = `
    <div class="close"><button onclick="closeItem()" aria-label="關閉">✕</button></div>
    <div class="gallery" id="gal">${ph.length ? ph.map((id,i)=>`<img src="${img(id,1000)}" data-full="${img(id,1600)}" alt="${esc(p.model)} 照片 ${i+1}" loading="${i?"lazy":"eager"}">`).join("") : `<div class="noimg">照片整理中</div>`}</div>
    ${ph.length>1?`<div class="dots" id="dots">1 / ${ph.length}・左右滑動看更多</div>`:""}
    <div class="detail">
      <div style="color:var(--red);font-weight:700;font-size:13px">${esc(p.branch||"")}</div>
      <h2>${esc(p.model)}</h2>
      <div class="specs">${specs(p).map(s=>`<span class="spec">${esc(s)}</span>`).join("")}</div>
      <div class="p">${fmt(p.price)}</div>
      ${extra?`<div class="note" style="padding:0">附件：${esc(extra)}</div>`:""}
      ${checkTable(p)}
      <div class="box"><h3>保固與購買方式</h3><div class="note">
        ・本店保固 ${days} 天，加入 LINE 好友再享 CARE+ 延長 30 天<br>
        ・按「LINE 詢問」由門市真人回覆，保留方式、贈品、付款都在 LINE 說明<br>
        ・限到店取機，取機時請攜帶身分證件，現場驗機確認後交機
      </div></div>
    </div>
    <div class="stickyAct">
      ${pay}
      <a class="btn line" href="${lineUrl(p.branch, interestText(p))}" onclick="track('${esc(p.branch)}')">💬 LINE 詢問這台</a>
    </div>`;
  $("#mask").classList.add("show"); $("#sheet").classList.add("show");
  $("#sheet").scrollTop = 0;
  try{ history.replaceState(null, "", "#item=" + encodeURIComponent(p.id)); }catch(e){}
  const gal = $("#gal");
  if (ph.length > 1) gal.addEventListener("scroll", () => {
    const i = Math.round(gal.scrollLeft / (gal.firstElementChild.offsetWidth + 6));
    $("#dots").textContent = `${Math.min(i+1, ph.length)} / ${ph.length}・左右滑動看更多`;
  }, { passive:true });
  gal.querySelectorAll("img").forEach(im => im.onclick = () => { $("#viewImg").src = im.dataset.full; $("#viewer").classList.add("show"); });
}
function closeItem(){
  $("#mask").classList.remove("show"); $("#sheet").classList.remove("show");
  try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){}
}
$("#mask").onclick = closeItem;
$("#viewer").onclick = () => $("#viewer").classList.remove("show");

/* LINE 訊息格式跟 LINE 卡片的「先問問題」一樣，機器人會自動回覆門市地址電話，店員再接手 */
function interestText(p){
  const label = (p.model + (p.color ? " " + p.color : "")).slice(0, 40);
  return "我有興趣：" + label + "（" + (p.branch || "楠梓店") + "）$" + p.price + "\n（官網中古機現貨）";
}
function lineUrl(branch, text){
  const s = STORES[branch] || STORES["楠梓店"];
  return "https://line.me/R/oaMessage/" + encodeURIComponent(s.lineId) + "/?" + encodeURIComponent(text);
}
function askLine(p){ track(p.branch); location.href = lineUrl(p.branch, interestText(p)); }
function track(branch){
  try{ window.gtag && gtag("event","line_inquiry",{ store: branch }); }catch(e){}
  try{ window.fbq && fbq("track","Contact",{ content_category:"used_phone" }); }catch(e){}
}

$("#q").addEventListener("input", e=>{ state.q=e.target.value.trim(); render(); });
$("#store").addEventListener("change", e=>{ state.store=e.target.value; render(); });
$("#sort").addEventListener("change", e=>{ state.sort=e.target.value; render(); });
document.addEventListener("keydown", e=>{ if (e.key==="Escape"){ $("#viewer").classList.remove("show"); closeItem(); } });

load();
</script>
</body>
</html>
